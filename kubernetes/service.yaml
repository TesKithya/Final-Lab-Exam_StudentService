
apiVersion: v1
kind: Service
metadata:
  name: student-gateway-service
spec:
  type: NodePort
  selector:
    app: student-core
  ports:
    - name: gateway
      port: 3005
      targetPort: 3005
      nodePort: 30005

---
apiVersion: v1
kind: Service
metadata:
  name: student-update-service
spec:
  type: ClusterIP
  selector:
    app: student-update
  ports:
    - name: update
      port: 3002
      targetPort: 3002
