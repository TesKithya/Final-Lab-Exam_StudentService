
apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-core-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-core
  template:
    metadata:
      labels:
        app: student-core
    spec:
      containers:
        - name: api-gateway
          image: student-gateway:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3005
          env:
            - name: PORT
              value: "3005"
            - name: REGISTRATION_SERVICE_URL
              value: "http://localhost:3001"
            - name: UPDATE_SERVICE_URL
              value: "http://student-update-service:3002"

        - name: registration-service
          image: student-registration:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_URI

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-update-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-update
  template:
    metadata:
      labels:
        app: student-update
    spec:
      containers:
        - name: update-service
          image: student-update:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              value: "3002"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_URI
